name: Zhuanlema
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  Zhuanlema:
    type: application
    platform: iOS
    sources:
      - path: Zhuanlema
      - path: Shared
    info:
      path: Zhuanlema/Info.plist
      properties:
        CFBundleDisplayName: 今天赚了吗
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zhuanlema
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: ZhuanlemaWidget
        embed: true
        codeSign: true

  ZhuanlemaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZhuanlemaWidget
      - path: Shared
    info:
      path: ZhuanlemaWidget/Info.plist
      properties:
        CFBundleDisplayName: 今天赚了吗
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.zhuanlema.widget
        SKIP_INSTALL: "YES"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "NO"

schemes:
  Zhuanlema:
    build:
      targets:
        Zhuanlema: all
    run:
      config: Debug
    archive:
      config: Release
