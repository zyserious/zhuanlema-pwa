name: ios

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  compile:
    name: 编译验证（不签名）
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译
        working-directory: ios
        run: |
          xcodebuild \
            -project Zhuanlema.xcodeproj \
            -scheme Zhuanlema \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包未签名 ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Debug-iphoneos/Zhuanlema.app Payload/
          zip -qry Zhuanlema-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Zhuanlema-unsigned-ipa
          path: ios/Zhuanlema-unsigned.ipa
          if-no-files-found: warn
